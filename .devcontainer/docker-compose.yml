# Standalone compose for the dev-container workspace only.
#
# Crucial: `name: social-login` matches infra/docker-compose.yml, so the
# `social-login` network here resolves to the same docker network
# (`social-login_social-login`) that `make up` creates. That lets the
# workspace reach compose services by name (keycloak:8080, backend-db:5432,
# …) when you run `./gradlew bootRun` or `bun run dev` from inside.
#
# We deliberately do NOT include ../infra/docker-compose.yml here: that
# would force `${VAR}` interpolation on every service in it, which would
# in turn require .env to live in this file's project directory. Keeping
# the workspace standalone avoids that.

name: social-login

networks:
  social-login:
    driver: bridge

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    init: true
    command: sleep infinity
    volumes:
      - ..:/workspaces/social-login:cached
    networks: [social-login]
    environment:
      # Force file-watching to use polling. inotify events on docker bind
      # mounts are unreliable, so Vite (Nuxt) and chokidar miss source
      # edits and HMR silently no-ops. Polling has a small CPU cost but
      # is the standard workaround for dev-in-container.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Bind dev servers to all interfaces so the published ports below
      # actually reach them. Nuxt defaults to 127.0.0.1; Spring already
      # binds 0.0.0.0 so this only matters for the BFF.
      NUXT_HOST: "0.0.0.0"
    # Publish dev-server ports straight to the host instead of relying on
    # VS Code's auto-forward tunnel. The tunnel works for plain GETs but
    # can mishandle OAuth's form_post callback / WebSocket upgrades, which
    # surfaces as "site can't be reached" on /auth/keycloak/callback and
    # broken HMR. Direct publishing avoids that whole layer.
    #
    # Collision warning: these conflict with the compose `frontend` /
    # `backend` services which also bind host:3000 / host:8081. That is
    # fine under the `make up-infra` workflow (which deliberately skips
    # those two), but `make up` (full stack) will fail to start frontend
    # and backend while the devcontainer is running. Stop the devcontainer
    # first, or stick to `make up-infra` + `make dev-*`.
    ports:
      - "3000:3000"  # nuxt dev (bun run dev)
      - "8081:8081"  # spring boot dev (./gradlew bootRun)
