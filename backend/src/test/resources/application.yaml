spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWKS is fetched lazily — the dummy URL keeps tests offline.
          jwk-set-uri: http://localhost:0/jwks-not-fetched-in-tests
          issuer-uri: http://localhost:0/realms/test
